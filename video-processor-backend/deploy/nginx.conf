server {
    listen 80;
    server_name srv1881496.hstgr.cloud;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name srv1881496.hstgr.cloud;

    # SSL Configuration (Will be populated by Certbot)
    # ssl_certificate /etc/letsencrypt/live/srv1881496.hstgr.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/srv1881496.hstgr.cloud/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'";

    # Support Large File Uploads (up to 500MB)
    client_max_body_size 500M;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Proper IP Forwarding for Rate Limiter
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Long Video Processing
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }

    # Frontend Static Files (If serving frontend from the same VPS)
    # location / {
    #     root /srv1881496.hstgr.cloud/video-processor/dist;
    #     try_files $uri $uri/ /index.html;
    # }
}
